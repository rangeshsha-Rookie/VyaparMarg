name: VyaparMarg CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: pip install -r services/api/requirements.txt
      - name: Run backend and data tests
        run: pytest services/api/tests tests -v

  pnpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter mobile build
      - name: Type-check native app
        run: pnpm --filter mobile-native typecheck
      - name: Build browser extension
        run: pnpm --filter @vyaparmarg/extension build
